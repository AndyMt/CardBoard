services:
  app:
    build:
      context: .
      args:
        BUILD_NUMBER: ${BUILD_NUMBER:-dev}
    image: cardboard:${BUILD_NUMBER:-latest}
    container_name: cardboard
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - BUILD_NUMBER=${BUILD_NUMBER:-dev}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/board"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
